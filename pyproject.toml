[project]
name = "ecoprocesos"
version = "0.0.1"
description = "Local process narrator for Linux: translates, prioritizes and narrates system activity."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
collect = ["psutil>=5.9"]

[dependency-groups]
dev = ["pytest>=8", "psutil>=5.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecoprocesos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
